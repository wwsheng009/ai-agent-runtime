name: Build aicli for Windows 7 (Go 1.20)

# 触发条件：
# 1. 推送形如 win7-*（含 win7-v1.2.3 等）的 tag 时自动编译并发布 Release
# 2. 手动在 Actions 页面触发（不发布 Release，只产出工件）
#
# 背景：主线 go.mod 要求 go 1.24，其编译产物会调用 Windows 7 不存在的
# 系统 API（如 Windows 10 1903+ 才有的 ConPTY），在 Win7 上启动即崩溃
# （Exception 0xc0000005 PC=0x0）。
# 本 workflow 使用 Go 1.20 + 独立的 go.win7.mod（降级依赖）+ win7compat
# build tag（裁剪 MCP/markdown 渲染等依赖），产出可在 Windows 7 上运行的
# aicli.exe。所有兼容代码由 build tag / 独立模块文件隔离，不影响主线。
on:
  push:
    tags:
      - 'win7-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.20.14'
  WORKDIR: backend
  CMD_PATH: ./cmd/aicli
  BIN_NAME: aicli-win7
  MODFILE: go.win7.mod
  BUILD_TAGS: win7compat
  CGO_ENABLED: '0'
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build-win7:
    name: Build Windows 7 compatible aicli (Go 1.20, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/${{ env.MODFILE }}.sum

      - name: Verify toolchain
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go version
          go env GOOS GOARCH GOTOOLCHAIN GOPROXY CGO_ENABLED

      - name: Resolve Go 1.20 dependency graph
        working-directory: ${{ env.WORKDIR }}
        # -modfile 通过 GOFLAGS 传入：与本地验证路径一致。
        # go 1.20 没有 GOTOOLCHAIN 自动下载，依赖 go.mod 的 go 指令
        # 必须 <= 1.20（go.win7.mod 已固定），此步确认解析可行。
        run: |
          set -euo pipefail
          GOFLAGS="-modfile=${{ env.MODFILE }}" go list -m -mod=mod all >/dev/null
          GOFLAGS="-modfile=${{ env.MODFILE }}" go mod verify

      - name: Build Windows 7 compatible binary
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          mkdir -p dist
          GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go build -tags ${{ env.BUILD_TAGS }} -mod=mod -trimpath \
            -o dist/${{ env.BIN_NAME }}.exe ${{ env.CMD_PATH }}

      - name: Verify binary build metadata
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          ls -lh dist/${{ env.BIN_NAME }}.exe
          # go version -m 输出编译工具链版本，确认确实是 Go 1.20 产物
          go version -m dist/${{ env.BIN_NAME }}.exe | sed -n '1,8p'
          test "$(go version -m dist/${{ env.BIN_NAME }}.exe | awk '$1=="go"{print $2}')" = "go1.20.14"
          # PE 头校验：MZ 魔数
          test "$(head -c 2 dist/${{ env.BIN_NAME }}.exe)" = "MZ"
          sha256sum dist/${{ env.BIN_NAME }}.exe | tee dist/${{ env.BIN_NAME }}.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ github.sha }}
          path: |
            backend/dist/${{ env.BIN_NAME }}.exe
            backend/dist/${{ env.BIN_NAME }}.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows 7 Release
    needs: [build-win7]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist/*.exe
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}