name: Build aicli for Windows 7 (Go 1.20)

# 触发条件：
# 1. 推送形如 win7-*（含 win7-v1.2.3 等）的 tag 时自动编译并发布 Release
# 2. 手动在 Actions 页面触发（不发布 Release，只产出工件）
#
# 背景：主线 go.mod 要求 go 1.24，其编译产物会调用 Windows 7 不存在的
# 系统 API（如 Windows 10 1903+ 才有的 ConPTY），在 Win7 上启动即崩溃
# （Exception 0xc0000005 PC=0x0）。
# 本 workflow 使用 Go 1.20 + 独立的 go.win7.mod（降级依赖）+ win7compat
# build tag（裁剪要求更高 Go 版本的 MCP 依赖），产出可在 Windows 7 上运行的
# aicli.exe。所有兼容代码由 build tag / 独立模块文件隔离，不影响主线。
on:
  push:
    tags:
      - 'win7-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.20.14'
  WORKDIR: backend
  CMD_PATH: ./cmd/aicli
  CONSOLE_CMD_PATH: ./cmd/aicli-console
  RUNTIME_SERVER_CMD_PATH: ./cmd/runtime-server
  BIN_NAME: aicli-win7
  CONSOLE_BIN_NAME: aicli-console-win7
  RUNTIME_SERVER_BIN_NAME: runtime-server-win7
  MODFILE: go.win7.mod
  BUILD_TAGS: win7compat
  CGO_ENABLED: '0'
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build-win7:
    name: Build Windows 7 compatible aicli (Go 1.20, amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/${{ env.MODFILE }}.sum

      - name: Verify toolchain
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go version
          go env GOOS GOARCH GOTOOLCHAIN GOPROXY CGO_ENABLED

      - name: Resolve Go 1.20 dependency graph
        working-directory: ${{ env.WORKDIR }}
        # -modfile 通过 GOFLAGS 传入：与本地验证路径一致。
        # go 1.20 没有 GOTOOLCHAIN 自动下载，依赖 go.mod 的 go 指令
        # 必须 <= 1.20（go.win7.mod 已固定），此步确认解析可行。
        run: |
          set -euo pipefail
          GOFLAGS="-modfile=${{ env.MODFILE }}" go list -m -mod=mod all >/dev/null
          GOFLAGS="-modfile=${{ env.MODFILE }}" go mod verify

      - name: Test Go 1.20 compatibility shims and console launcher
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go test -tags ${{ env.BUILD_TAGS }} ./internal/agent \
            -run 'TestAgentWithoutCancel|TestAgentWithTimeoutCause|TestComputeAvailableToolsDoesNotExposePolicyDeniedSpawnSubagents' \
            -count=1
          GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go test -tags ${{ env.BUILD_TAGS }} ./cmd/aicli-console -count=1
          # Cross-compile the command tests instead of executing a Windows test
          # binary on Linux. This catches Go 1.20/build-tag regressions in the
          # ReadConsoleW Unicode/IME compatibility path.
          GOOS=windows GOARCH=amd64 GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go test -tags ${{ env.BUILD_TAGS }} ./cmd/aicli/commands \
            -run 'Test(ReadChatSessionLine|ParseChatCommandOptionsConsoleInputMode|DecodeSystemConsoleLine|ReadSystemConsoleUTF16Line|LegacyConsoleDispatchAcceptsCommittedIMEProcessCharacter)' \
            -c -o /tmp/aicli-commands-win7.test.exe
          test "$(head -c 2 /tmp/aicli-commands-win7.test.exe)" = "MZ"
          rm -f /tmp/aicli-commands-win7.test.exe

      - name: Build Windows 7 compatible binary
        working-directory: ${{ env.WORKDIR }}
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-win7-dev}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}"
          GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go build -tags ${{ env.BUILD_TAGS }} -mod=mod -trimpath -ldflags "${LDFLAGS}" \
            -o dist/${{ env.BIN_NAME }}.exe ${{ env.CMD_PATH }}
          GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go build -tags ${{ env.BUILD_TAGS }} -mod=mod -trimpath \
            -o dist/${{ env.CONSOLE_BIN_NAME }}.exe ${{ env.CONSOLE_CMD_PATH }}
          # runtime-server：Win7 客户端通过 `aicli --runtime-server <host>` 连接。
          # 版本注入走 internal/buildinfo（与主线 release workflow 一致）。
          GOFLAGS="-modfile=${{ env.MODFILE }}" \
            go build -tags ${{ env.BUILD_TAGS }} -mod=mod -trimpath \
            -ldflags "-s -w -X github.com/wwsheng009/ai-agent-runtime/internal/buildinfo.version=${VERSION} -X github.com/wwsheng009/ai-agent-runtime/internal/buildinfo.buildTime=${BUILD_TIME}" \
            -o dist/${{ env.RUNTIME_SERVER_BIN_NAME }}.exe ${{ env.RUNTIME_SERVER_CMD_PATH }}

      - name: Verify binary build metadata
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          for binary in \
            "dist/${{ env.BIN_NAME }}.exe" \
            "dist/${{ env.CONSOLE_BIN_NAME }}.exe" \
            "dist/${{ env.RUNTIME_SERVER_BIN_NAME }}.exe"; do
            ls -lh "${binary}"
            # go version -m 的首行为 "<binary>: go1.20.14"；旧 awk
            # 检查错误地寻找以 "go" 开头的字段，导致有效构建被判失败。
            go version -m "${binary}" | sed -n '1,8p'
            test "$(go version -m "${binary}" | sed -n '1s/.*: //p')" = "go${{ env.GO_VERSION }}"
            # PE 头校验：MZ 魔数
            test "$(head -c 2 "${binary}")" = "MZ"
            sha256sum "${binary}" | tee "${binary}.sha256"
          done

      - name: Package Windows 7 bundle
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="win7-dev-$(git rev-parse --short HEAD)"
          fi
          BASENAME="aicli-${VERSION}-windows-amd64"
          rm -rf dist/release
          mkdir -p dist/release
          cp dist/${{ env.BIN_NAME }}.exe dist/release/aicli.exe
          cp dist/${{ env.CONSOLE_BIN_NAME }}.exe dist/release/aicli-console.exe
          cp dist/${{ env.RUNTIME_SERVER_BIN_NAME }}.exe dist/release/runtime-server.exe
          cp ../docs/aicli/windows7.md dist/release/WINDOWS7-README.md
          (
            cd dist/release
            zip -9 -r "../${BASENAME}.zip" ./*
          )
          sha256sum "dist/${BASENAME}.zip" > "dist/${BASENAME}.zip.sha256"
          rm -rf dist/release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ github.sha }}
          path: |
            backend/dist/${{ env.BIN_NAME }}.exe
            backend/dist/${{ env.BIN_NAME }}.exe.sha256
            backend/dist/${{ env.CONSOLE_BIN_NAME }}.exe
            backend/dist/${{ env.CONSOLE_BIN_NAME }}.exe.sha256
            backend/dist/${{ env.RUNTIME_SERVER_BIN_NAME }}.exe
            backend/dist/${{ env.RUNTIME_SERVER_BIN_NAME }}.exe.sha256
            backend/dist/aicli-win7-*-windows-amd64.zip
            backend/dist/aicli-win7-*-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Windows 7 Release
    needs: [build-win7]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}