name: Release aicli

# 触发条件：
# 1. 推送形如 v*（含 v1.2.3、v1.2.3-rc.1、aicli-v1.2.3 等）的 tag 时自动编译并发布 Release
# 2. 手动在 Actions 页面触发（可选自定义版本号，不发布 Release，只产出工件）
on:
  push:
    tags:
      - 'v*'
      - 'aicli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本号（可选，默认使用 short SHA）'
        required: false
        default: ''
      publish_release:
        description: '是否创建 GitHub Release（仅手动触发时可选）'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  GO_VERSION: '1.24.2'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.27.0'
  PLAYWRIGHT_CLI_VERSION: '0.1.17'
  CMD_PATH: ./cmd/aicli
  BIN_NAME: aicli
  WORKDIR: backend
  CGO_ENABLED: '0'
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release-gate:
    name: Release reliability gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Soft gate: keep reliability coverage visible, but do not block aicli binary
    # packaging/publish when the full console/reliability matrix is unavailable.
    # Hard release prerequisites remain in the validate job (no-CGO build/tests).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Playwright browser
        id: playwright_browser
        continue-on-error: true
        shell: pwsh
        run: >-
          npx --yes --package "@playwright/cli@$env:PLAYWRIGHT_CLI_VERSION"
          playwright-cli install-browser chrome-for-testing --with-deps

      - name: Run release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "output/release-gate/logs" | Out-Null

          $sha = if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) {
            $env:GITHUB_SHA.Trim()
          } else {
            (& git rev-parse HEAD).Trim()
          }
          $version = "gate-" + $sha.Substring(0, [Math]::Min(12, $sha.Length))
          $gateArgs = @(
            "-Version", $version,
            "-PlaywrightVersion", $env:PLAYWRIGHT_CLI_VERSION,
            "-StepTimeoutSeconds", "1200"
          )
          if ("${{ steps.playwright_browser.outcome }}" -eq "success") {
            $gateArgs += "-SkipBrowserInstall"
          }

          Write-Host "Release gate tools:"
          foreach ($cmd in @("go", "git", "node", "pnpm", "npx", "pwsh")) {
            $resolved = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($null -eq $resolved) {
              Write-Host "  $cmd => MISSING"
            } else {
              Write-Host "  $cmd => $($resolved.Source)"
            }
          }
          Write-Host "Invoking: ./scripts/verify-release.ps1 $($gateArgs -join ' ')"

          try {
            & ./scripts/verify-release.ps1 @gateArgs
            if ($LASTEXITCODE -ne 0) {
              throw "verify-release.ps1 exited with code $LASTEXITCODE"
            }
          } catch {
            $msg = $_.Exception.Message
            $bootLog = "output/release-gate/logs/bootstrap-failure.log"
            @(
              "Release gate bootstrap/run failed.",
              "version=$version",
              "sha=$sha",
              "message=$msg",
              "exception=$($_.Exception.ToString())"
            ) | Set-Content -LiteralPath $bootLog -Encoding utf8
            Write-Error $msg
            exit 1
          }

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: output/release-gate/**
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Validate no-CGO build prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Verify Go environment
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go env GOOS GOARCH CGO_ENABLED GOPROXY
          test "$(go env CGO_ENABLED)" = "0"

      - name: Verify SQLite no-CGO packages
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go test ./internal/sqlitedriver ./internal/chat ./internal/team ./internal/agentcontrol -count=1

      - name: Verify aicli no-CGO build
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/aicli-cgo0-check ${CMD_PATH}
          /tmp/aicli-cgo0-check version

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    # Hard gate: validate (no-CGO). Soft gate: release-gate (continue-on-error).
    needs: [validate, release-gate]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} build_time=${BUILD_TIME}"

      - name: Build
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          echo "GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=${CGO_ENABLED}"
          test "${CGO_ENABLED}" = "0"
          EXT=""
          if [[ "${GOOS}" == "windows" ]]; then EXT=".exe"; fi
          ARTIFACT="${BIN_NAME}-${GOOS}-${GOARCH}${EXT}"
          OUTDIR="../dist"
          mkdir -p "${OUTDIR}"
          LDFLAGS="-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.buildTime=${{ steps.ver.outputs.build_time }}"
          echo "Building ${ARTIFACT} with ldflags: ${LDFLAGS}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "${OUTDIR}/${ARTIFACT}" ${CMD_PATH}
          ls -lh "${OUTDIR}/${ARTIFACT}"

      - name: Package artifact
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          VERSION="${{ steps.ver.outputs.version }}"
          EXT=""
          if [[ "${GOOS}" == "windows" ]]; then EXT=".exe"; fi
          BIN="${BIN_NAME}-${GOOS}-${GOARCH}${EXT}"
          BASENAME="${BIN_NAME}-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p dist/release
          cp "dist/${BIN}" "dist/release/${BIN_NAME}${EXT}"
          # 复制可选的 README / LICENSE（如果存在）
          [ -f README.md ] && cp README.md dist/release/ || true
          [ -f LICENSE ] && cp LICENSE dist/release/ || true
          cd dist/release
          if [[ "${GOOS}" == "windows" ]]; then
            ARCHIVE="../${BASENAME}.zip"
            zip -9 "${ARCHIVE}" ./*
          else
            ARCHIVE="../${BASENAME}.tar.gz"
            tar -czf "${ARCHIVE}" ./*
          fi
          cd ..
          # 生成 sha256 校验
          ARCHIVE_NAME="$(basename "${ARCHIVE}")"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          rm -rf release
          ls -lh
          echo "archive=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.basename }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Aggregate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          : > SHA256SUMS.txt
          for f in *.sha256; do
            cat "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
