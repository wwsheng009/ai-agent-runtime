name: Release aicli + runtime-server

# 触发条件：
# 1. 推送形如 v*（含 v1.2.3、v1.2.3-rc.1、aicli-v1.2.3 等）的 tag 时自动编译并发布 Release
# 2. 手动在 Actions 页面触发（可选自定义版本号，不发布 Release，只产出工件）
on:
  push:
    tags:
      - 'v*'
      - 'aicli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本号（可选，默认使用 short SHA）'
        required: false
        default: ''
      publish_release:
        description: '是否创建 GitHub Release（仅手动触发时可选）'
        required: false
        default: 'false'

permissions:
  contents: read

env:
  GO_VERSION: '1.24.2'
  # Windows 7 兼容构建：Go 1.20 + 独立依赖图 go.win7.mod + win7compat tag。
  # 主线 go 1.24 产物调用 ConPTY 等 Win10+ 才存在的系统 API，Win7 上
  # 启动即崩溃（0xc0000005）；兼容产物由本 workflow 的 build-win7 job
  # 随每次 v* 发布附带。
  WIN7_GO_VERSION: '1.20.14'
  WIN7_MODFILE: go.win7.mod
  WIN7_BUILD_TAGS: win7compat
  NODE_VERSION: '24'
  PNPM_VERSION: '10.27.0'
  PLAYWRIGHT_CLI_VERSION: '0.1.17'
  RIPGREP_VERSION: '15.2.0'
  CMD_PATH: ./cmd/aicli
  BIN_NAME: aicli
  WORKDIR: backend
  CGO_ENABLED: '0'
  GOPROXY: https://proxy.golang.org,direct

jobs:
  release-gate:
    name: Release reliability gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Soft gate: keep reliability coverage visible, but do not block aicli binary
    # packaging/publish when the full console/reliability matrix is unavailable.
    # Hard release prerequisites remain in the validate job (no-CGO build/tests).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Playwright browser
        id: playwright_browser
        continue-on-error: true
        shell: pwsh
        run: >-
          npx --yes --package "@playwright/cli@$env:PLAYWRIGHT_CLI_VERSION"
          playwright-cli install-browser chrome-for-testing --with-deps

      - name: Run release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gateOutput = "output/release-gate"
          $evidenceRoot = "artifacts/release-gate"
          New-Item -ItemType Directory -Force -Path (Join-Path $gateOutput "logs") | Out-Null
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null

          $sha = if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) {
            $env:GITHUB_SHA.Trim()
          } else {
            (& git rev-parse HEAD).Trim()
          }
          $version = "gate-" + $sha.Substring(0, [Math]::Min(12, $sha.Length))
          # Splat a named-parameter hashtable: order-independent binding that is
          # immune to the argument-transformation failure seen on every prior run
          # ("'StepTimeoutSeconds' cannot convert value 'output/release-gate' to
          # type 'System.Int32'" -- the gate died before running any check).
          $gateArgs = @{
            Version = $version
            OutputDir = $gateOutput
            PlaywrightVersion = $env:PLAYWRIGHT_CLI_VERSION
            StepTimeoutSeconds = 1200
          }
          if ("${{ steps.playwright_browser.outcome }}" -eq "success") {
            $gateArgs.SkipBrowserInstall = $true
          }

          Write-Host "Release gate tools:"
          foreach ($cmd in @("go", "git", "node", "pnpm", "npx", "pwsh")) {
            $resolved = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($null -eq $resolved) {
              Write-Host "  $cmd => MISSING"
            } else {
              Write-Host "  $cmd => $($resolved.Source)"
            }
          }
          Write-Host "Invoking: ./scripts/verify-release.ps1 $($gateArgs -join ' ')"

          try {
            & ./scripts/verify-release.ps1 @gateArgs
            if ($LASTEXITCODE -ne 0) {
              throw "verify-release.ps1 exited with code $LASTEXITCODE"
            }
          } catch {
            $msg = $_.Exception.Message
            $bootLog = Join-Path $gateOutput "logs/bootstrap-failure.txt"
            @(
              "Release gate bootstrap/run failed.",
              "version=$version",
              "sha=$sha",
              "message=$msg",
              "exception=$($_.Exception.ToString())"
            ) | Set-Content -LiteralPath $bootLog -Encoding utf8
            # Prefer host output + explicit exit so Stop-mode Write-Error cannot
            # rethrow before the finally staging block finishes.
            Write-Host "::error::Release gate failed: $msg"
            exit 1
          }
          finally {
            # Stage evidence outside gitignored output/ so diagnosis files are easy
            # to collect even when only partial gate output exists.
            if (Test-Path -LiteralPath $evidenceRoot) {
              Remove-Item -LiteralPath $evidenceRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
            if (Test-Path -LiteralPath $gateOutput) {
              Copy-Item -Path (Join-Path $gateOutput '*') -Destination $evidenceRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            $manifest = Join-Path $evidenceRoot "upload-manifest.txt"
            $files = @()
            if (Test-Path -LiteralPath $evidenceRoot) {
              $files = @(Get-ChildItem -LiteralPath $evidenceRoot -Recurse -File | ForEach-Object {
                $_.FullName.Substring((Resolve-Path $evidenceRoot).Path.Length + 1)
              })
            }
            @(
              "gate_output=$gateOutput",
              "evidence_root=$evidenceRoot",
              "file_count=$($files.Count)",
              "files:"
            ) + $files | Set-Content -LiteralPath $manifest -Encoding utf8
            Write-Host "Staged release-gate evidence: $($files.Count) files under $evidenceRoot"
          }

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: artifacts/release-gate/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Validate no-CGO build prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Verify Go environment
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go env GOOS GOARCH CGO_ENABLED GOPROXY
          test "$(go env CGO_ENABLED)" = "0"

      - name: Verify SQLite no-CGO packages
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go test ./internal/sqlitedriver ./internal/chat ./internal/team ./internal/agentcontrol -count=1

      - name: Verify aicli no-CGO build
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/aicli-cgo0-check ${CMD_PATH}
          /tmp/aicli-cgo0-check version

      # E4 hard gate: render packages must be green before any release.
      # NOTE: as of the semantic red baseline (Phase 0/C0), 4 band-scrollback
      # semantic tests in ./cmd/aicli/ui fail by design; this gate stays red
      # until Phase 1 fixes the underlying geometry bug (docs/plan/
      # aicli-tui-owned-render-simplification-implementation-guide.md §6).
      - name: Verify aicli render packages (E4 hard gate)
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go test ./cmd/aicli/ui/... -count=1

      # C0 dual-run gate: the Scene presenter mode (AICLI_SCENE_PRESENTER=1)
      # must produce byte-identical output with the legacy render path across
      # the whole render-layer parity suite, in BOTH process-level env modes.
      - name: Verify render parity gate - legacy mode (AICLI_SCENE_PRESENTER unset)
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          go test ./cmd/aicli/commands/ -run 'TestRenderLayer|TestPresenterSwitch' -count=1

      - name: Verify render parity gate - Scene presenter mode (AICLI_SCENE_PRESENTER=1)
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          AICLI_SCENE_PRESENTER=1 go test ./cmd/aicli/commands/ -run 'TestRenderLayer|TestPresenterSwitch' -count=1

  build-frontend:
    name: Build embedded frontend (webui dist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload webui dist
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    # Hard gate: validate (no-CGO). Soft gate: release-gate (continue-on-error).
    needs: [validate, release-gate]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} build_time=${BUILD_TIME}"

      - name: Build
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          echo "GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=${CGO_ENABLED}"
          test "${CGO_ENABLED}" = "0"
          EXT=""
          if [[ "${GOOS}" == "windows" ]]; then EXT=".exe"; fi
          ARTIFACT="${BIN_NAME}-${GOOS}-${GOARCH}${EXT}"
          OUTDIR="../dist"
          mkdir -p "${OUTDIR}"
          LDFLAGS="-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.buildTime=${{ steps.ver.outputs.build_time }}"
          echo "Building ${ARTIFACT} with ldflags: ${LDFLAGS}"
          go build -trimpath -ldflags "${LDFLAGS}" -o "${OUTDIR}/${ARTIFACT}" ${CMD_PATH}
          ls -lh "${OUTDIR}/${ARTIFACT}"

      - name: Bundle verified ripgrep
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-ripgrep-release.sh \
            "${RIPGREP_VERSION}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            "dist/rg"

      - name: Package artifact
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          VERSION="${{ steps.ver.outputs.version }}"
          EXT=""
          if [[ "${GOOS}" == "windows" ]]; then EXT=".exe"; fi
          BIN="${BIN_NAME}-${GOOS}-${GOARCH}${EXT}"
          BASENAME="${BIN_NAME}-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p dist/release/codex-path
          cp "dist/${BIN}" "dist/release/${BIN_NAME}${EXT}"
          cp "dist/rg/rg${EXT}" "dist/release/codex-path/rg${EXT}"
          # 复制可选的 README / LICENSE（如果存在）
          [ -f README.md ] && cp README.md dist/release/ || true
          [ -f LICENSE ] && cp LICENSE dist/release/ || true
          cd dist/release
          if [[ "${GOOS}" == "windows" ]]; then
            ARCHIVE="../${BASENAME}.zip"
            zip -9 -r "${ARCHIVE}" ./*
          else
            ARCHIVE="../${BASENAME}.tar.gz"
            tar -czf "${ARCHIVE}" ./*
          fi
          cd ..
          # 生成 sha256 校验
          ARCHIVE_NAME="$(basename "${ARCHIVE}")"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          rm -rf release
          ls -lh
          echo "archive=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.basename }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  build-server:
    name: Build runtime-server ${{ matrix.goos }}/${{ matrix.goarch }}
    # 复用 build-frontend 产出的 webui dist；要求 validate 与前端构建均成功。
    needs: [validate, build-frontend]
    if: ${{ always() && needs.validate.result == 'success' && needs.build-frontend.result == 'success' }}
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/go.sum

      - name: Download prebuilt frontend
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: frontend/dist

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"

      - name: Package runtime-server
        shell: pwsh
        run: |
          # 子进程运行打包脚本并把全部输出(含解析错误/trap)追加到 dist/package-step.log，
          # 失败时由后续步骤将日志推到 ci-debug-* 分支（匿名可读），精确暴露失败点。
          $pkgLog = Join-Path $env:GITHUB_WORKSPACE 'dist/package-step.log'
          New-Item -ItemType Directory -Force -Path (Split-Path $pkgLog) | Out-Null
          Add-Content -LiteralPath $pkgLog -Value "== wrapper start $(Get-Date -Format o) cell=${{ matrix.goos }}/${{ matrix.goarch }} version=${{ steps.ver.outputs.version }} =="
          & pwsh -NoProfile -File ./scripts/package-runtime-server.ps1 `
            -OutputDir dist `
            -Version "${{ steps.ver.outputs.version }}" `
            -Goos "${{ matrix.goos }}" `
            -Goarch "${{ matrix.goarch }}" `
            -SkipFrontendInstall `
            -SkipFrontendBuild *>> $pkgLog
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $pkgLog) {
            Get-Content -LiteralPath $pkgLog -Tail 120 -ErrorAction SilentlyContinue
          }
          exit $code

      - name: Upload server debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-debug-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/**/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish server debug log branch (on failure)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="ci-debug-${{ github.run_id }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          git config user.name "ci-release-bot"
          git config user.email "actions@users.noreply.github.com"
          # dist/ 被 gitignore：必须 -f 强制加入；zip 等半成品也一并推上去取证。
          git add -f -A dist 2>/dev/null || true
          git commit -m "ci: server debug evidence (run ${{ github.run_id }})" 2>/dev/null || true
          URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f "$URL" "HEAD:$BRANCH" 2>&1 || (sleep 5 && git push -f "$URL" "HEAD:$BRANCH" 2>&1) || exit 0
          exit 0

      - name: Publish server debug log issue (on failure)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BODY_FILE="dist/debug-issue-body.txt"
          {
            echo "## phase trail (dist/phases.log)"
            cat dist/phases.log 2>/dev/null || echo "(no phases.log)"
            echo
            echo "## package-step.log (tail ~8000 bytes)"
            tail -c 8000 dist/package-step.log 2>/dev/null || echo "(no package-step.log)"
            echo
            echo "## dist listing"
            ls -la dist 2>/dev/null || echo "(no dist/)"
          } > "$BODY_FILE"
          BODY=$(python3 -c 'import json,sys; sys.stdout.write(json.dumps(open(sys.argv[1],encoding="utf-8",errors="replace").read()[:7000]))' "$BODY_FILE")
          curl -s -o /dev/null -w "issue http %{http_code}\n" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"ci-debug: server package failure run ${{ github.run_id }} (${{ matrix.goos }}/${{ matrix.goarch }})\",\"body\":${BODY}}"

      - name: Verify server archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BASENAME="runtime-server-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          test -f "dist/${BASENAME}.zip"
          test -f "dist/${BASENAME}.zip.sha256"
          ls -lh "dist/${BASENAME}.zip" "dist/${BASENAME}.zip.sha256"
          echo "archive=${BASENAME}.zip" >> "$GITHUB_OUTPUT"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.basename }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  build-win7:
    name: Build Windows 7 compatible aicli (Go 1.20)
    # 独立 job：Go 1.20.14 + go.win7.mod（降级依赖图）+ win7compat build tag
    # （裁剪 MCP/markdown 渲染依赖）产出可在 Windows 7 上运行的 aicli.exe。
    # 与主线矩阵隔离，不共享 go.sum 缓存（依赖图不同）。
    needs: [validate, release-gate]
    if: ${{ always() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go ${{ env.WIN7_GO_VERSION }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.WIN7_GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.WORKDIR }}/${{ env.WIN7_MODFILE }}.sum

      - name: Build Windows 7 compatible aicli
        id: ver
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building aicli-win7 (version ${VERSION}) with Go ${{ env.WIN7_GO_VERSION }}"
          mkdir -p dist
          GOFLAGS="-modfile=${{ env.WIN7_MODFILE }}" \
            go build -tags ${{ env.WIN7_BUILD_TAGS }} -mod=mod -trimpath \
            -o dist/aicli-win7.exe ${CMD_PATH}
          # 校验产物确实是 Go 1.20 编译（buildinfo 内嵌工具链版本）
          test "$(go version -m dist/aicli-win7.exe | awk '$1=="go"{print $2}')" = "${{ env.WIN7_GO_VERSION }}"
          ls -lh dist/aicli-win7.exe

      - name: Package artifact
        id: pkg
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BASENAME="${BIN_NAME}-win7-${VERSION}-windows-amd64"
          mkdir -p dist/release
          cp dist/aicli-win7.exe dist/release/${BIN_NAME}.exe
          # 可选的 README / LICENSE（与主 build job 一致）
          [ -f README.md ] && cp README.md dist/release/ || true
          [ -f LICENSE ] && cp LICENSE dist/release/ || true
          cd dist/release
          ARCHIVE="../${BASENAME}.zip"
          zip -9 -r "${ARCHIVE}" ./*
          cd ..
          ARCHIVE_NAME="$(basename "${ARCHIVE}")"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          rm -rf release
          ls -lh
          echo "archive=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "basename=${BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.basename }}
          path: |
            dist/${{ steps.pkg.outputs.archive }}
            dist/${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, build-server, build-win7]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist

      - name: Aggregate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          : > SHA256SUMS.txt
          for f in *.sha256; do
            cat "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
