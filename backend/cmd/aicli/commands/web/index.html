<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aicli micro web client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>aicli micro web client</h1>
  <button id="sidebar-toggle" type="button" title="折叠/展开会话列表">☰</button>
  <button id="theme-toggle" type="button" title="切换深色/浅色主题（Ctrl+L）">☾</button>
  <span id="connection-status">connecting</span>
  <span id="turn-status">-</span>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">会话</span>
      <select id="sessions-sort" title="会话排序方式">
        <option value="created_at">创建时间</option>
        <option value="updated_at">更新时间</option>
      </select>
      <button id="sessions-new-btn" type="button" title="新建会话">＋</button>
      <button id="sessions-refresh-btn" type="button" title="刷新会话列表">⟳</button>
      <button id="sidebar-collapse-btn" type="button" title="折叠会话列表">«</button>
    </div>
    <div class="sidebar-search">
      <input id="session-search" type="search" placeholder="搜索会话…" autocomplete="off" title="按标题/摘要过滤会话">
    </div>
    <div id="session-list"><div class="session-empty">加载中…</div></div>
  </aside>

  <div id="main-col">
    <!-- 审批模态框：替换原内联 approval-panel -->
    <div id="approval-overlay">
      <div id="approval-modal">
        <div id="approval-modal-header">
          <span id="approval-modal-title">待处理请求</span>
          <button id="approval-modal-close" class="modal-close" type="button" title="关闭">✕</button>
        </div>
        <div id="approval-modal-body">
          <div id="approval-prompt" class="approval-prompt"></div>
          <div id="question-suggestions"></div>
          <button id="detail-toggle" class="detail-toggle" type="button">显示详情</button>
          <div id="approval-detail" class="approval-detail"></div>
        </div>
        <div id="approval-modal-footer">
          <button id="deny-btn" class="deny-btn">拒绝</button>
          <button id="approve-btn" class="approve-btn">允许</button>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-main-btn" type="button">对话</button>
      <button class="tab-btn" id="tab-log-btn" type="button">日志</button>
    </div>

    <div id="tab-main" class="tab-panel active">
      <div id="conversation">
        <div id="screen">(empty)</div>
        <div id="welcome" style="display:none">
          <h2>欢迎使用 aicli micro web client</h2>
          <p>选择一个会话开始对话，或输入消息按回车发送。</p>
          <div class="welcome-suggestions">
            <button class="welcome-chip" type="button" data-prompt="帮我列出当前项目目录结构">📁 项目结构</button>
            <button class="welcome-chip" type="button" data-prompt="解释 Go 的 defer 机制">📖 Go defer</button>
            <button class="welcome-chip" type="button" data-prompt="写一个简单的 HTTP 服务器示例">💻 HTTP 示例</button>
          </div>
        </div>
        <div id="stream-msg"></div>
      </div>
      <span id="screen-copy-btn" class="screen-copy-btn" style="display:none" title="复制会话内容">⧉ 复制</span>
      <span id="scroll-bottom-btn" class="scroll-bottom-btn" style="display:none">↓ 最新</span>
      <div id="input-row">
        <textarea id="prompt" rows="1" placeholder="输入消息后回车发送，Shift+Enter 换行…" autocomplete="off"></textarea>
        <button id="send-btn">发送</button>
        <span id="send-status"></span>
      </div>
    </div>

    <div id="tab-log" class="tab-panel">
      <div id="log-toolbar">
        <button id="log-clear-btn" type="button">清空</button>
        <span id="log-count">0 条事件</span>
      </div>
      <div id="event-log"></div>
    </div>
  </div>
</div>

    <div id="footer">
      <span id="footer-endpoints"><a href="/debug/endpoints" target="_blank" rel="noopener">/debug/endpoints</a></span>
      <span class="sep">|</span>
      <span id="footer-web"><a href="/web/" target="_blank" rel="noopener">/web/</a></span>
    </div>
    <div id="toast-container"></div>
    <div id="shortcut-help" style="display:none">
      <div class="shortcut-overlay"></div>
      <div class="shortcut-panel">
        <h3>快捷键</h3>
        <table>
          <tr><td>Enter</td><td>发送消息</td></tr>
          <tr><td>Shift+Enter</td><td>换行</td></tr>
          <tr><td>↑/↓</td><td>浏览输入历史</td></tr>
          <tr><td>Esc</td><td>中断（停止）</td></tr>
          <tr><td>Ctrl+L</td><td>切换深色/浅色主题</td></tr>
          <tr><td>Ctrl+K</td><td>清空当前屏幕</td></tr>
          <tr><td>Ctrl+/</td><td>显示/隐藏此面板</td></tr>
        </table>
        <button class="shortcut-close" type="button">关闭</button>
      </div>
    </div>
    <script src="app.js"></script>
    </body>
</html>
