version: "v1"

# Windows 7 uses the Go 1.21.4 toolchain with go-sqlite3 v0.22.0
# (same driver version as the main build). Its proper shared-memory
# support (shm_windows.go) makes multi-process WAL concurrency work on
# Win7, so the session database is shared with the main build.
sessions:
  # Shared mode: the runtime server opens the same master session-history
  # database that aicli processes write. WAL plus busyTimeout make
  # multi-process concurrent access safe, so no database copies are made.
  backend: sqlite
  storePath: session_history.sqlite

agent:
  # The model decides when the run is complete. Positive limits are explicit
  # operator policies; zero keeps the normal agent loop unbounded.
  maxSteps: 0
  maxToolCalls: 0
  maxExplorationSteps: 0
  maxRepeatedToolCalls: 0
  timeout: 0s
  enableParallelTools: true
  maxParallelToolCalls: 4

background:
  # Background tools are also unbounded unless timeout_sec is supplied.
  defaultTimeout: 0s
  monitorInterval: 250ms
  heartbeatTimeout: 30s
  launchMaxAttempts: 3
  retryBackoff: 500ms
  # maxInteractiveSessions 限制存活的交互式（write_stdin/PTY）会话数；默认 64。
  # 交互会话不占用一次性命令的并发调度槽（maxConcurrentJobs）。
  # maxInteractiveSessions: 64
  # -1 keeps explicitly rerunnable jobs recovering until they are cancelled.
  recoveryMaxAttempts: -1
  recoveryBackoffSchedule: [30s, 1m, 2m, 3m, 5m]
  # 作业持久化：显式 storePath 指向 aicli local 会话共用的 background.sqlite，
  # 使 web 服务提交的作业跨重启保留，并与 CLI 会话双向可见（同一个文件）。
  # WAL + busy_timeout + 单连接池 + 锁重试的统一并发基线见 internal/sqliteutil；
  # 显式 storePath 不依赖 sessionRuntime.defaultPersistence，因此不会把
  # Team/AgentControl/Artifact 一并级联到共享目录。
  storePath: ~/.aicli/sessions/runtime/background.sqlite

goal:
  # maxConsecutiveContinuations 限制每条用户消息触发的自动续跑轮数；默认 0 =
  # 不限制（对齐 Codex：goal active 时持续续跑，直到完成/暂停/中断或容忍阈值）。
  # 正整数 = 成本安全阀：到达上限的可见提示出现后，发送任意消息可继续。
  # maxConsecutiveContinuations: 0
  # defaultTokenBudget 是新建 goal 的默认 token 预算（0=无预算）；耗尽后目标
  # 置 budget_limited，可用 /goal budget <n> 提高预算后 resume。
  # defaultTokenBudget: 0
  # serverAutoContinuation 启用 runtime-server 进程内的 goal 自动续跑驱动器
  # （gap 3）：与 runtime.yaml 保持一致（Win7 覆盖档不是独立行为分叉）。
  serverAutoContinuation: true

context:
  # Used only when neither provider/model capability nor context.maxPromptTokens
  # can provide an effective prompt budget.
  fallbackMaxPromptTokens: 32000
  # 上下文计量口径（2026-10-11 事故修复）：
  #   provider_first（默认，留空即此值）— 发送前判定以 provider 上报用量为锚点，
  #     本地估算只负责增量与兜底；
  #   estimate_only — 回退到旧行为（仅本地估算），用于紧急回退/对照实验。
  # accountingMode: provider_first

images:
  cacheMaxAge: 1h
  generations:
    default_model: gpt-image-2
    default_size: "1024x1024"
    default_quality: medium
    default_output_format: png
    request_timeout: 5m
    max_n: 4

sessionRuntime:
  # 会话运行时事件/状态持久化：显式 storePath 指向本服务专用文件
  # backend/data/runtime/session_runtime.sqlite，使 Trajectory 断线恢复
  # （/api/runtime/sessions/{id}/runtime/events）跨重启可回放。
  defaultPersistence: memory
  storePath: ../data/runtime/session_runtime.sqlite
  # P1.7 读写双池：默认启用（读走只读连接池，query_only + 3s 读超时）；
  # 回滚：readPool.disable: true 恢复单池行为。
  # readPool:
  #   disable: false
  #   size: 4
  #   busyTimeout: 5s
  #   operationTimeout: 3s

observe:
  # Runtime Observation Plane: 默认关闭；此处显式开启只读观测 API。
  # 启用后注册 /api/runtime/observe/v1/*（capabilities / snapshot /
  # sessions/{session_id} / events）。SSE 与 renderer 依赖 Phase 3/4，v1 不注册。
  enabled: true

knowledge:
  # 知识层（docs/knowledge_Layer）总开关；Phase 2 已完成、ADR-0004 已 Accepted，
  # 门禁解除：on / shadow 均可（Phase 0「只允许 off」口径已过期）。
  # 取值：off（关闭）/ shadow（只索引不注入）/ on（索引 + 注入；装配链按 W7a
  # 保守映射 on → context_knowledge_mode=signals，由宿主自动注入，勿重复配置）。
  mode: on
  # code_tools：Phase 3（06 §4 Phase 3）的 code.* 工具面开关；取值与语义
  # 必须与 runtime.yaml 保持一致（win7 文件是覆盖档，不是行为分叉）。
  code_tools: on
  # watch：Phase 5 交付 1 的第三类变更源（fsnotify 文件系统监听；off|on，默认
  # off）。语义与 runtime.yaml 的注释一致：开启后空闲期的外部变更被即时发现，
  # 关闭时由判定点校正（git/stat）在下一个 turn 边界发现。
  # watch: on
  # planner：Reuse Gate 的保守阈值（06 §4 Phase 2 W3；04 §4.4 阈值策略）。
  # 下列值即代码缺省值，初值待 Phase 2 实测校准（04 §7.6）；取消注释即可覆盖。
  # planner:
  #   min_reuse_confidence: 0.80    # 同任务直接复用下限
  #   write_reuse_confidence: 0.90  # 同任务写操作下限（复用 + 强制验证读取）
  #   cross_task_confidence: 0.90   # 跨任务下限（复用 + 强制验证读取）
  #   verify_read_below: 0.90       # 低于此值必须安排一次验证读取
  #   explore_below: 0.50           # 低于此值触发探索（04 §4.4 硬下限）
