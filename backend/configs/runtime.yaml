version: "v1"

sessions:
  # Read-replica mode: the runtime server reads from a private copy of the
  # master session-history database (session_history.sqlite, owned/written by
  # aicli processes). aicli holds the master's WAL/-shm file locks; direct
  # reads from the master get blocked and return
  # "会话存储查询超时（共享数据库被并发写入占用）". The replica is re-synced
  # from the master every replicaSyncInterval and hot-swapped.
  backend: sqlite
  storePath: session_history_replica.sqlite
  replicaSource: session_history.sqlite
  replicaSyncInterval: 30s

agent:
  # The model decides when the run is complete. Positive limits are explicit
  # operator policies; zero keeps the normal agent loop unbounded.
  maxSteps: 0
  maxToolCalls: 0
  maxExplorationSteps: 0
  maxRepeatedToolCalls: 0
  timeout: 0s
  enableParallelTools: true
  maxParallelToolCalls: 4

background:
  # Background tools are also unbounded unless timeout_sec is supplied.
  defaultTimeout: 0s
  monitorInterval: 250ms
  heartbeatTimeout: 30s
  launchMaxAttempts: 3
  retryBackoff: 500ms
  # -1 keeps explicitly rerunnable jobs recovering until they are cancelled.
  recoveryMaxAttempts: -1
  recoveryBackoffSchedule: [30s, 1m, 2m, 3m, 5m]

context:
  # Used only when neither provider/model capability nor context.maxPromptTokens
  # can provide an effective prompt budget.
  fallbackMaxPromptTokens: 32000

images:
  cacheMaxAge: 1h
  generations:
    default_model: gpt-image-2
    default_size: "1024x1024"
    default_quality: medium
    default_output_format: png
    request_timeout: 5m
    max_n: 4

observe:
  # Runtime Observation Plane: 默认关闭；此处显式开启只读观测 API。
  # 启用后注册 /api/runtime/observe/v1/*（capabilities / snapshot /
  # sessions/{session_id} / events）。SSE 与 renderer 依赖 Phase 3/4，v1 不注册。
  enabled: true

sessionRuntime:
  # 会话运行时事件/状态持久化：显式 storePath 指向本服务专用文件
  # backend/data/runtime/session_runtime.sqlite，使 Trajectory 断线恢复
  # （/api/runtime/sessions/{id}/runtime/events）跨重启可回放。
  # 注意：defaultPersistence 必须保持 memory（默认）。若设为 file，会级联把
  # Team/AgentControl/Artifact/Background 的 store 路径也填充到共享的
  # C:\Users\vince\.aicli\sessions\runtime\*.sqlite —— 该目录被正在运行的
  # aicli CLI 进程持有锁，executionDiagnosticsSnapshot 访问这些 store 时会
  # 无视 2s ctx 阻塞在 sqlite busy_timeout（默认 60s），导致 /api/runtime/health
  # 死锁。显式 storePath 与 DefaultPersistence 无关，refreshSessionRuntimeStore
  # 只看 StorePath 非空即启用专用文件 store。
  defaultPersistence: memory
  storePath: ../data/runtime/session_runtime.sqlite
