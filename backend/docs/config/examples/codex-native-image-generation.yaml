# Codex 原生 image_generation 配置示例
#
# 复制到 providers.items 下后，按需修改 name / base_url / api_key。
# 默认全局行为是关闭自动注入；只有显式 enable_image_generation: true
# 且 model capability 完整时，才会向 Codex Responses 请求追加：
#   {"type":"image_generation","output_format":"png"}

providers:
  items:
    CODEX_NATIVE_IMAGE_EXAMPLE:
      enabled: true
      protocol: codex
      type: openai
      base_url: https://api.openai.com
      api_path: /v1/responses
      forward_url: /v1/responses
      api_key: ${CODEX_NATIVE_IMAGE_API_KEY:-}
      default_model: gpt-5.4
      supported_models:
        - gpt-5.4
        - gpt-5.4-mini
        - "*"
      # Provider-level opt-in. Omit or set false to keep native tool injection off.
      enable_image_generation: true
      model_capabilities:
        "*":
          input_modalities:
            - text
          native_tools:
            image_generation: false
            images_generations_api: false
        gpt-5.4:
          input_modalities:
            - text
            - image
          native_tools:
            # Path B: Codex Responses native tool
            image_generation: true
            # Path A remains independent; leave false unless this endpoint exists.
            images_generations_api: false
        gpt-5.4-mini:
          input_modalities:
            - text
            - image
          native_tools:
            image_generation: true
            images_generations_api: false
      timeout: 300s

    # 对比：仅有 model capability、未 opt-in 时，不会注入 native tool。
    CODEX_COMPAT_NO_NATIVE_IMAGE:
      enabled: true
      protocol: codex
      base_url: https://example-codex-compatible.invalid
      api_path: /v1/responses
      forward_url: /v1/responses
      api_key: ${CODEX_COMPAT_API_KEY:-}
      default_model: gpt-5.4
      # enable_image_generation 缺省 = 关闭
      model_capabilities:
        gpt-5.4:
          input_modalities:
            - text
            - image
          native_tools:
            image_generation: true
      timeout: 300s
