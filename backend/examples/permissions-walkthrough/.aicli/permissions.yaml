# 权限示例工程：docs/aicli/permissions.md 的可执行对照
#
# 本文件是一个「项目级」权限文件（<project>/.aicli/permissions.yaml，§2.1）。
# 它演示手册 §2 的 specifier 语法与 §1.3 的 disable_bypass 进程策略；
# 同目录 walkthrough_test.go 会用真实 policy.Engine 装载本文件并逐条断言结果。
#
#   cd backend && go test ./examples/permissions-walkthrough/ -count=1 -v
#
# 边界说明（读手册 §3.2）：根/主目录断路器、敏感写保护、外部目录门是引擎内置的
# 硬门，不通过 rules 配置；bypass_permissions 能跳过敏感写与外部目录门（但跳不过
# 断路器）。验证方式见本目录 README「硬门怎么验」。

version: 1

# §1.3 / §2.1：任一层权限文件写 true 即生效（多层取 OR）。
# 引擎把以 bypass_permissions 进入的请求按 default 求值（该问的照问、headless 照拒），
# CLI/ACP/runtime API 的切换入口由宿主另行拦截；dont_ask 与 plan 不受影响。
disable_bypass: true

rules:
  # ① allow + Shell specifier（手册 §2.2 / §4.1）
  #    `git status:*` 是「前缀 + 参数」形态：命中 `git status` 本身与任意后续参数；
  #    复合命令要求每一段都命中**同一个 specifier**（§2.2 / §6.5）。跨 specifier
  #    的复合命令不会被单条 allow 规则拼出来（见 README「已知差异」）。
  - name: allow-git-read-only
    tools: ["Shell(git status:*)", "Shell(git diff:*)"]
    decision: allow
    reason: allow_git_readonly

  # ② ask + Shell specifier（手册 §4.2）
  #    ask 在 rules 阶段命中后进入审批（CLI 面板 [1]/[2]…，§3.3）；
  #    bypass 下普通 ask 会被放行，本示例靠 disable_bypass 把它拉回 default。
  - name: ask-before-push
    tools: ["Shell(git push:*)"]
    decision: ask
    reason: review_git_push

  # ③ ask + Read path specifier（手册 §2.3 / §4.4）
  #    无分隔符的相对形态 = 任意深度命中同名文件；`**` 跨目录层级。
  - name: review-secret-reads
    tools: ["Read(.env)", "Read(**/*.pem)"]
    decision: ask
    reason: review_secret_reads

  # ④ deny + Edit path specifier（手册 §4.3 / §4.4）
  #    deny 在 rules 阶段立即返回；显式 deny 规则连 bypass_permissions 也不能越过（§1.1 末行）。
  - name: protect-generated-and-vcs
    tools: ["Edit(dist/**)", "Edit(.git/**)"]
    decision: deny
    reason: protect_generated

  # ⑤ allow + Edit path specifier（手册 §2.3）
  #    只覆盖工作区 src/ 子树；其他路径不匹配时回落模式默认（default 下为询问）。
  - name: allow-src-edits
    tools: ["Edit(src/**)"]
    decision: allow
    reason: allow_src_edits

  # ⑥ allow + WebFetch domain specifier（手册 §2.4）
  #    匹配对象是网络工具 URL 的 host；精确主机不覆盖子域，`*.example.com` 也不含 apex。
  #    domain: 前缀可省略；这里写全便于与手册对照。
  - name: allow-docs-site
    tools: ["WebFetch(domain:docs.example.com)"]
    decision: allow
    reason: allow_docs_site
