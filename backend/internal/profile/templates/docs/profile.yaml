# {{name}} — 文档场景：文件读写 + 搜索 + 命令执行。
profile:
  name: {{name}}
  description: {{description}}
  default_agent: {{agent}}

prompts:
  mode: replace

tools:
  allowlist:
    - view
    - grep
    - glob
    - ls
    - write
    - edit
    - multiedit
    - append_write
    - apply_patch
    - shell
    - web_search
    - fetch
  read_only: false

# 仅暴露文档相关技能时取消注释（名称需与 skills 目录中的实际技能一致）：
# skills:
#   allowlist:
#     - view_file_content
#     - fetch_url_content
