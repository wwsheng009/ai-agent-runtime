# {{name}} — 最小可用场景：读取/检索 + 基础文件编辑，全部技能关闭。
# 适合低成本/受限环境，但需完成基础的文件编辑工作（不执行 shell）。
profile:
  name: {{name}}
  description: {{description}}
  default_agent: {{agent}}

# 最短提示词：role.md 仅保留一句目标说明。
prompts:
  mode: replace

# 工具面 = 读取/检索（view/grep/glob/ls）+ 基础编辑（write/edit/apply_patch）；
# read_only: false 允许写操作，使 agent 能完成基础的文件编辑。
tools:
  allowlist:
    - view
    - grep
    - glob
    - ls
    - write
    - edit
    - apply_patch
  # 不提供命令执行：显式拒绝 shell 类工具（deny 恒优先于 allow）。
  denylist:
    - shell
    - bash
    - aicli_exec
  read_only: false

# 全部技能关闭（通配 deny；deny 恒优先于 allow）。
skills:
  denylist: ["*"]

# 无 MCP：排除全部服务器（连接前过滤：不连接、不注册工具）。
mcp:
  exclude_servers: ["*"]
