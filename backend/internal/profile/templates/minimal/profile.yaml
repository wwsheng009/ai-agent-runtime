# {{name}} — 最小可用场景：读取/检索 + 基础文件编辑 + 命令执行，全部技能关闭。
# 适合低成本/受限环境，但需完成基础的文件编辑与命令执行工作（不含子代理/团队等控制面）。
profile:
  name: {{name}}
  description: {{description}}
  default_agent: {{agent}}

# 最短提示词：role.md 仅保留一句目标说明。
prompts:
  mode: replace

# 工具面 = 读取/检索（view/grep/glob/ls）+ 基础编辑（write/edit/apply_patch）+ 命令执行（shell）；
# 读取/检索/编辑/执行的最小集，不放行子代理/团队等控制面工具。
# read_only: false 允许写操作与命令执行，使 agent 能完成基础的文件编辑与命令。
tools:
  allowlist:
    - view
    - grep
    - glob
    - ls
    - write
    - edit
    - apply_patch
    - shell
  read_only: false

# 全部技能关闭（通配 deny；deny 恒优先于 allow）。
skills:
  denylist: ["*"]

# 无 MCP：排除全部服务器（连接前过滤：不连接、不注册工具）。
mcp:
  exclude_servers: ["*"]
