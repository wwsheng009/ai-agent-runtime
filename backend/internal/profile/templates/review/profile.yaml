# {{name}} — 评审/巡检场景：只读工具面，禁止写入，不连接任何 MCP server。
profile:
  name: {{name}}
  description: {{description}}
  default_agent: {{agent}}

prompts:
  mode: replace

# 只读工具集：仅检索/读取类内置工具；read_only: true 拒绝一切写操作。
tools:
  allowlist:
    - view
    - grep
    - glob
    - ls
    - web_search
    - fetch
  # 子代理/团队等控制面工具自 2026-10-16 起不再有 essential 豁免：上面的
  # allowlist 本身就会裁掉它们；这里的 denylist 是防御性双保险（deny 恒优先，
  # 即便日后有人放宽 allowlist，deny 仍能拦住；也覆盖 MCP/宿主侧同名工具）。
  denylist:
    - subagent_spawn
    - subagent_spawn_batch
    - team_spawn
  read_only: true

# 无 MCP：排除全部服务器（连接前过滤：不连接、不注册工具）。
mcp:
  exclude_servers: ["*"]
